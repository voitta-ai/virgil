name: release

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    paths-ignore:
      - '.github/**'
      - '**.md'

permissions:
  contents: read

env:
  VERSION_FILE: app/build.gradle.kts

jobs:
  version-bumped:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version must advance
        env:
          BASE: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$BASE"
          new=$(grep -oE 'versionName = "[^"]+"' "$VERSION_FILE" | grep -oE '[0-9][^"]*')
          new_code=$(grep -oE 'versionCode = [0-9]+' "$VERSION_FILE" | grep -oE '[0-9]+')
          # Bootstrap: base branch predates this version file entirely, e.g. the
          # PR that first adds this workflow. Any version on the PR side passes.
          if git cat-file -e "FETCH_HEAD:$VERSION_FILE" 2>/dev/null; then
            old=$(git show "FETCH_HEAD:$VERSION_FILE" | grep -oE 'versionName = "[^"]+"' | grep -oE '[0-9][^"]*')
            old_code=$(git show "FETCH_HEAD:$VERSION_FILE" | grep -oE 'versionCode = [0-9]+' | grep -oE '[0-9]+')
          else
            old=""
            old_code=""
          fi
          if [ -z "$old" ]; then
            echo "Bootstrap: no $VERSION_FILE on $BASE; accepting $new (versionCode $new_code)."
            exit 0
          fi
          if [ "$old" = "$new" ]; then
            echo "::error::$VERSION_FILE versionName is still $old - bump it."
            exit 1
          fi
          if [ "$(printf '%s\n%s\n' "$old" "$new" | sort -V | head -1)" != "$old" ]; then
            echo "::error::$new does not advance past $old."
            exit 1
          fi
          # versionCode is the monotonic identifier Android distribution
          # enforces; versionName advancing is not enough on its own.
          if [ "$new_code" -le "$old_code" ]; then
            echo "::error::versionCode must strictly increase ($old_code -> $new_code)."
            exit 1
          fi
          echo "$old (code $old_code) -> $new (code $new_code)"

  tag-and-release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag and release if the version is new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(grep -oE 'versionName = "[^"]+"' "$VERSION_FILE" | grep -oE '[0-9][^"]*')
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "v$version is already tagged; nothing to release."
            exit 0
          fi
          gh release create "v$version" \
            --title "v$version" \
            --generate-notes \
            --target "$GITHUB_SHA"
